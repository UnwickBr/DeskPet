name: DeskPet para Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["desktop/**", ".github/workflows/windows-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pyside6 pyinstaller

      - name: Gerar DeskPet.exe
        run: >
          pyinstaller desktop/deskpet.py --name DeskPet --onefile --windowed --noconfirm
          --icon desktop/assets/deskpet.ico
          --add-data "desktop/sprites;sprites"
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPet-Windows
          path: dist/DeskPet.exe

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'windows-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'DeskPet para Windows (última versão)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Baixe o **DeskPet.exe** abaixo e dê dois cliques. Não precisa instalar nada.
            Clique com o botão direito no coelho para abrir as configurações.
          files: dist/DeskPet.exe
